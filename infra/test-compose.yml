# Separate server, credentials, port and disposable storage from the app stack.
name: hyperplane-tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperplane_test
      POSTGRES_PASSWORD: hyperplane_test
      POSTGRES_DB: hyperplane_test_admin
    ports:
      - "127.0.0.1:15497:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperplane_test -d hyperplane_test_admin"]
      interval: 1s
      timeout: 3s
      retries: 30
